name: political-bias-llms

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      # PyTorch con CUDA 12.8, usado en el entorno original del proyecto.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128

      # Entrenamiento y clasificación
      - transformers==5.5.3
      - datasets==4.8.4
      - accelerate==1.13.0
      - sentencepiece==0.2.1
      - tiktoken==0.12.0
      - safetensors==0.7.0

      # Procesamiento y evaluación
      - pandas==2.3.3
      - numpy==2.2.6
      - scikit-learn==1.7.2
      - matplotlib==3.10.8
      - tqdm==4.67.3
      - pyarrow==23.0.1

      # Configuración y proveedores de LLMs
      - python-dotenv==1.2.2
      - openai==2.41.0
      - anthropic==0.105.2
      - google-genai==2.8.0
      - mistralai==2.4.9
